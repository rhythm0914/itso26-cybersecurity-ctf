<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Reset password &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body[data-page="auth"]::before { display: none; }
  .auth-bg {
    min-height: calc(100vh - 120px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(0, 255, 163, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(124, 92, 255, 0.05) 0%, transparent 50%),
      var(--bg);
    padding: 2rem 1rem;
  }
  .auth-card { max-width: 420px; }
  .auth-card h2 { text-align: center; margin-bottom: 0.5rem; }
  .auth-card .muted { text-align: center; }
  .auth-card .success-icon {
    font-size: 1.75rem;
    color: var(--success);
    text-shadow: 0 0 20px var(--success);
    display: block;
    margin-bottom: 0.3rem;
  }
</style>
</head>
<body data-page="auth">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <a href="login.html" class="btn btn--ghost" style="margin-left:auto">Back to sign in</a>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="auth-bg">
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center;margin-bottom:1rem">
          <span class="success-icon">&#128274;</span>
          <h2 style="margin:0;font-size:1.3rem">Set a new password</h2>
        </div>
        <p class="muted small" style="margin-bottom:1.25rem;text-align:center">Enter your new password. The reset link expires after 1 hour.</p>
        <form id="reset-form" novalidate>
          <input type="hidden" id="token" name="token">
          <div class="field">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
          </div>
          <div class="field" style="margin-top:0.6rem">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" required placeholder="Repeat your new password" autocomplete="new-password">
          </div>
          <div class="button-row" style="margin-top:0.5rem">
            <button type="submit" class="btn btn--primary btn--block" id="reset-btn">Reset password</button>
          </div>
        </form>
        <p class="muted small" style="text-align:center;margin-top:1.25rem">
          Have a link already? <a href="login.html">Sign in</a>.
        </p>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var url = new URL(location.href);
  var token = url.searchParams.get("token") || "";
  document.getElementById("token").value = token;
  if (!token) {
    document.getElementById("reset-form").innerHTML =
      '<div class="panel" style="text-align:center;padding:2rem"><p class="muted">No reset token provided. <a href="forgot-password.html">Request a reset</a>.</p></div>';
  }
  var form = document.getElementById("reset-form");
  var btn = document.getElementById("reset-btn");
  var orig = btn.textContent;
  function flash(msg, tone) {
    var box = document.getElementById("page-status");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var np = String(form.elements.new_password.value || "");
    var conf = String(form.elements.confirm.value || "");
    if (!np || np.length < 8) { flash("Password must be at least 8 characters.", "error"); return; }
    if (np !== conf) { flash("Passwords do not match.", "error"); return; }
    btn.disabled = true; btn.textContent = "Resetting…";
    window.Auth.resetPassword(token, np).then(function () {
      btn.disabled = false; btn.textContent = orig;
      flash("Password reset. You can now sign in.", "ok");
      setTimeout(function () { location.href = "login.html"; }, 1200);
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = orig;
      flash(err.status === 400 ? "Invalid or expired reset token." : "Reset failed. Try again.", "error");
    });
  });
})();
</script>
</body>
</html>
