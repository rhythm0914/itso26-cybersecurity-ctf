<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body[data-page="auth"]::before {
    display: none;
  }
  .auth-bg {
    min-height: calc(100vh - 120px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(0, 255, 163, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(124, 92, 255, 0.05) 0%, transparent 50%),
      var(--bg);
    padding: 2rem 1rem;
  }
</style>
</head>
<body data-page="auth">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <a href="index.html" class="btn btn--ghost" style="margin-left:auto">Back to home</a>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="auth-bg">
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center;margin-bottom:1.5rem">
          <span style="font-family:var(--font-mono);font-size:2rem;color:var(--accent);text-shadow:0 0 20px var(--accent-glow);display:block;margin-bottom:0.5rem">&gt;_</span>
          <h2 style="margin:0;font-size:1.4rem">Sign in to your account</h2>
        </div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password">
          </div>
          <div class="button-row" style="margin-top:0.5rem">
            <button type="submit" class="btn btn--primary btn--block" id="login-btn">Sign in</button>
          </div>
          <div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border-subtle);text-align:center">
            <p class="muted small" style="margin:0 0 0.4rem">
              Don't have an account? <a href="signup.html">Create one</a>.
            </p>
            <p class="muted small" style="margin:0 0 0.4rem">
              Forgot your password? <a href="forgot-password.html">Reset it</a>.
            </p>
            <p class="muted small" style="margin:0">
              <a href="index.html">&larr; Back to home</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  var btn = document.getElementById("login-btn");
  var orig = btn.textContent;

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var email = String(form.elements.email.value || "").trim();
    var password = String(form.elements.password.value || "");
    if (!email || !password) { flash("Please enter email and password.", "error"); return; }
    btn.disabled = true; btn.textContent = "Signing in…";
    window.Auth.login(email, password).then(function (data) {
      btn.disabled = false; btn.textContent = orig;
      if (data && data.ok) { flash("Signed in as " + data.user.username + ".", "ok"); location.replace("dashboard.html"); }
      else { flash(data && data.error ? data.error : "Sign in failed.", "error"); }
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = orig;
      flash(err.status === 401 ? "Invalid email or password." : "Sign in failed. Try again.", "error");
    });
  });

  function flash(msg, tone) {
    var box = document.getElementById("page-status");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
})();
</script>
</body>
</html>
