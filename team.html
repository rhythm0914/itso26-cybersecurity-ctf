<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Team &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .team-page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .team-page-header h2 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
  }
  .team-page-header .muted {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 0.2rem;
  }
  .team-page-header .button-row {
    flex-shrink: 0;
  }
  .team-body-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    margin-top: 1rem;
  }
  @media (min-width: 640px) {
    .team-body-grid { grid-template-columns: 280px 1fr; }
  }
  .roster {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .roster-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elevated);
    transition: all var(--transition);
  }
  .roster-item:hover {
    background: var(--surface);
    border-color: var(--border);
  }
  .roster-item .role {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--accent);
    font-family: var(--font-mono);
    flex-shrink: 0;
    min-width: 55px;
  }
  .roster-item .name {
    flex: 1;
    font-weight: 500;
    font-size: 0.9rem;
    color: var(--text);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roster-item .empty {
    color: var(--text-dim);
    font-style: italic;
  }
  .join-box {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    background: var(--bg-elevated);
    height: 100%;
  }
  .join-box h4 {
    margin: 0 0 0.75rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
  }
  .chat-section {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-subtle);
  }
  .chat-section h3 {
    margin: 0 0 0.75rem;
    font-size: 1.05rem;
  }
</style>
</head>
<body data-page="team">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <nav class="topbar__nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="teams.html">Teams</a>
      <a href="challenges.html">Challenges</a>
    </nav>
    <div class="topbar__status">
      <button class="btn btn--ghost btn--small" id="logout-btn">Sign out</button>
    </div>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="page-status" id="flash" role="status" aria-live="polite" data-visible="false"></div>

  <section class="section">
    <div class="section__head">
      <h2 id="team-page-title">Team</h2>
      <span class="pill" id="team-pill" style="margin-left:auto">Loading</span>
    </div>
    <div id="team-loader" class="panel" style="text-align:center;padding:2rem">
      <div class="loading"><div class="spinner"></div><span class="muted" style="margin-left:0.75rem">Loading team…</span></div>
    </div>

    <div id="team-content" hidden>
      <div class="team-page-header">
        <div>
          <h2 id="team-name">—</h2>
          <div id="team-meta" class="muted small"></div>
        </div>
        <div id="team-actions" class="button-row"></div>
      </div>

      <div class="team-body-grid">
        <div class="panel" style="min-width:0">
          <h3 style="margin:0 0 0.75rem;font-size:0.95rem">Roster</h3>
          <div id="roster" class="roster"></div>
          <div id="roster-empty" class="muted small" style="text-align:center;padding:1rem">No members.</div>
        </div>
        <div class="panel" style="min-width:0">
          <h3 style="margin:0 0 0.75rem;font-size:0.95rem">Join this team</h3>
          <div id="join-section">
            <div class="join-box">
              <div class="field">
                <label for="join-code">Join code</label>
                <input type="text" id="join-code" placeholder="Paste join code">
              </div>
              <div class="field" style="margin-top:0.6rem">
                <label for="join-name">Your name</label>
                <input type="text" id="join-name" placeholder="Your display name">
              </div>
              <button class="btn btn--primary" id="btn-join-code" style="margin-top:0.75rem;width:100%">Join by code</button>
            </div>
          </div>
          <div id="join-request-section" style="margin-top:0.75rem"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="chat-section section" id="chat-section">
    <div class="section__head">
      <h3>Team chat</h3>
      <span class="pill" id="chat-status">—</span>
    </div>
    <div class="chat-wrap">
      <div class="chat-sidebar">
        <h4>Members</h4>
        <div id="chat-members">
          <div class="muted small">No members.</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;height:100%;min-width:0">
        <div class="chat-messages" id="chat-messages" style="flex:1;min-height:250px"></div>
        <div class="chat-compose">
          <input type="text" id="chat-input" placeholder="Type a message…" autocomplete="off">
          <button class="btn btn--primary btn--small" id="chat-send">Send</button>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var user = null, teamId = null, pollTimer = null, memberFlag = false;
  function flash(msg, tone) {
    var box = document.getElementById("flash");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
  function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function qs(k) {
    var m = new URL(location.href).searchParams.get(k); return m;
  }

  function renderTeam(team, members) {
    document.getElementById("team-loader").hidden = true;
    document.getElementById("team-content").hidden = false;
    document.getElementById("team-name").textContent = esc(team.name);
    var meta = [];
    if (team.school) meta.push(esc(team.school));
    meta.push((members && members.length) + "/3 members");
    if (team.recruitment) meta.push("recruiting");
    document.getElementById("team-meta").textContent = meta.join(" &middot; ");
    document.getElementById("team-pill").textContent = team.name;

    var actions = document.getElementById("team-actions");
    actions.innerHTML = "";
    var rosterBox = document.getElementById("roster");
    var rosterEmpty = document.getElementById("roster-empty");
    var chatMembers = document.getElementById("chat-members");

    var isMember = !!(user && (members || []).some(function (m) { return m.user_id === user.id; }));
    memberFlag = isMember;
    var isCaptain = isMember && (members || []).some(function (m) { return m.user_id === user.id && (m.is_captain === 1 || m.slot_index === 0); });

    (members || []).forEach(function (m) {
      var el = document.createElement("div");
      el.className = "roster-item";
      var roleLabel = (m.is_captain === 1 || m.slot_index === 0) ? "CAPTAIN" : "MEMBER";
      var youBadge = m.user_id === (user && user.id) ? ' <span class="badge badge--solved" style="font-size:0.68rem">you</span>' : '';
      el.innerHTML = '<span class="role">'+ roleLabel +'</span>' +
        '<span class="name">'+ esc(m.name) +' ('+ esc(m.user_id ? "user" : "guest") +')</span>' +
        youBadge;
      rosterBox.appendChild(el);
      var cm = document.createElement("div");
      cm.className = "member" + (m.user_id === (user && user.id) ? " you" : "");
      cm.innerHTML = '<span class="dot"></span>' + esc(m.name) + (m.user_id === (user && user.id) ? " (you)" : "");
      chatMembers.appendChild(cm);
    });
    rosterEmpty.hidden = !!(members && members.length);
    if (chatMembers.children.length === 0 || chatMembers.innerText.trim() === "No members.") {
      chatMembers.innerHTML = '<div class="muted small">No members.</div>';
    }

    if (isCaptain) {
      var btnReq = document.createElement("button");
      btnReq.className = "btn btn--primary";
      btnReq.textContent = "Join requests";
      btnReq.onclick = function () { location.href = "teams.html"; };
      actions.appendChild(btnReq);
    }
    if (!isMember) {
      var btnJoinReq = document.createElement("button");
      btnJoinReq.className = "btn btn--primary";
      btnJoinReq.textContent = "Request to join";
      btnJoinReq.onclick = function () {
        var msg = prompt("Message to the captain (optional):", "");
        window.Auth.submitJoinRequest(teamId, msg || "").then(function () {
          flash("Join request sent.", "ok");
          setTimeout(function () { location.reload(); }, 800);
        }).catch(function (e) { flash(e.message || "Could not send request.", "error"); });
      };
      actions.appendChild(btnJoinReq);
    }

    var joinSection = document.getElementById("join-section");
    var joinReqSection = document.getElementById("join-request-section");
    if (isMember) {
      joinSection.hidden = true;
      joinReqSection.innerHTML = '<p class="muted small">You are a member of this team.</p>';
    } else if (!team.recruitment) {
      joinSection.hidden = true;
      joinReqSection.innerHTML = '<p class="muted small">This team is not recruiting.</p>';
    } else {
      joinSection.hidden = false;
      document.getElementById("btn-join-code").onclick = function () {
        var code = String(document.getElementById("join-code").value || "").trim();
        var name = String(document.getElementById("join-name").value || "").trim();
        if (!code || !name) { flash("Enter join code and your name.", "error"); return; }
        fetch(window.CTF_CONFIG.apiBase + "/api/teams/join", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code, name: name })
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (data.ok) { flash("Joined team " + esc(data.team.name) + ".", "ok"); setTimeout(function () { location.reload(); }, 800); }
          else { flash(data.error || "Could not join.", "error"); }
        }).catch(function () { flash("Could not join team.", "error"); });
      };
      joinReqSection.innerHTML = '<p class="muted small">Prefer to introduce yourself? Send a join request to the captain.</p>' +
        '<button class="btn btn--ghost" style="margin-top:0.5rem" onclick="sendReq()">Request to join</button>';
    }

    var chatWrap = document.querySelector(".chat-wrap");
    if (chatWrap) {
      chatWrap.parentElement.hidden = !isMember;
      document.getElementById("chat-section").hidden = !isMember;
    }
  }

  window.sendReq = function () {
    var msg = prompt("Message to the captain (optional):", "");
    window.Auth.submitJoinRequest(teamId, msg || "").then(function () {
      flash("Join request sent.", "ok");
      setTimeout(function () { location.reload(); }, 800);
    }).catch(function (e) { flash(e.message || "Could not send request.", "error"); });
  };

  function loadChat() {
    if (!teamId || !memberFlag) return;
    window.Auth.chatMessages(teamId).then(function (data) {
      var box = document.getElementById("chat-messages");
      var msgs = data.messages || [];
      if (!msgs.length) {
        box.innerHTML = '<div class="muted small" style="padding:1rem;text-align:center">No messages yet. Be the first to say something!</div>';
        return;
      }
      box.innerHTML = msgs.map(function (m) {
        var me = user && m.user_id === user.id;
        return '<div class="chat-message' + (me ? " me" : "") + '">' +
          '<div class="who">' + esc(m.username) + '</div>' +
          '<div class="body">' + esc(m.body) + '</div>' +
          '<div class="time">' + new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + '</div>' +
          '</div>';
      }).join("");
      box.scrollTop = box.scrollHeight;
    }).catch(function () {});
  }

  document.getElementById("chat-send").addEventListener("click", function () {
    var input = document.getElementById("chat-input");
    var text = String(input.value || "").trim();
    if (!text) return;
    input.disabled = true;
    window.Auth.sendMessage(teamId, text).then(function () {
      input.value = "";
      loadChat();
    }).catch(function (e) { flash(e.message || "Could not send message.", "error"); }).finally(function () {
      input.disabled = false; input.focus();
    });
  });
  document.getElementById("chat-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chat-send").click(); }
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    window.Auth.logout().then(function () { location.href = "login.html"; });
  });

  window.Auth.load().then(function (u) {
    user = u;
    teamId = qs("id");
    if (!teamId) {
      document.getElementById("team-loader").textContent = "No team specified.";
      document.getElementById("team-loader").style.textAlign = "center";
      return;
    }
    window.Auth.teamDetail(teamId).then(function (data) {
      renderTeam(data.team, data.members || []);
      loadChat();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadChat, 4000);
    }).catch(function () {
      document.getElementById("team-loader").textContent = "Team not found or you do not have access.";
      document.getElementById("team-loader").style.textAlign = "center";
    });
  });
})();
</script>
</body>
</html>
