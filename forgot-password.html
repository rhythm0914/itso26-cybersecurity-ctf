<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Forgot password &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="auth">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <a href="login.html" class="btn btn--ghost" style="margin-left:auto">Back to sign in</a>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Reset your password</h2>
      <p class="muted small" style="margin-bottom:1.25rem">Enter your email address. If an account exists, a reset link will be sent (if email is configured).</p>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="button-row">
          <button type="submit" class="btn btn--primary btn--block" id="forgot-btn">Send reset link</button>
        </div>
      </form>
      <p class="muted small" style="text-align:center;margin-top:1rem">
        Remember your password? <a href="login.html">Sign in</a>.
      </p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("forgot-form");
  var btn = document.getElementById("forgot-btn");
  var orig = btn.textContent;
  function flash(msg, tone) {
    var box = document.getElementById("page-status");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var email = String(form.elements.email.value || "").trim();
    if (!email) { flash("Please enter your email.", "error"); return; }
    btn.disabled = true; btn.textContent = "Sending…";
    window.Auth.forgotPassword(email).then(function () {
      btn.disabled = false; btn.textContent = orig;
      flash("If an account exists for that email, a reset link was sent.", "ok");
    }).catch(function () {
      btn.disabled = false; btn.textContent = orig;
      flash("Could not send reset email. Try again later.", "error");
    });
  });
})();
</script>
</body>
</html>
