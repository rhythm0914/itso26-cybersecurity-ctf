<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Forgot password &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body[data-page="auth"]::before { display: none; }
  .auth-bg {
    min-height: calc(100vh - 120px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(0, 255, 163, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(124, 92, 255, 0.05) 0%, transparent 50%),
      var(--bg);
    padding: 2rem 1rem;
  }
  .auth-card { max-width: 420px; }
  .auth-card h2 { text-align: center; margin-bottom: 0.5rem; }
  .auth-card .muted { text-align: center; }
</style>
</head>
<body data-page="auth">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <a href="login.html" class="btn btn--ghost" style="margin-left:auto">Back to sign in</a>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="auth-bg">
    <div class="auth-wrap">
      <div class="auth-card">
        <div style="text-align:center;margin-bottom:1rem">
          <span style="font-family:var(--font-mono);font-size:1.5rem;color:var(--warning);text-shadow:0 0 20px rgba(255,184,77,0.2);display:block;margin-bottom:0.3rem">&#128227;</span>
          <h2 style="margin:0;font-size:1.3rem">Reset your password</h2>
        </div>
        <p class="muted small" style="margin-bottom:1.25rem;text-align:center">Enter your email address. If an account exists, a reset link will be sent (if email is configured).</p>
        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="button-row" style="margin-top:0.5rem">
            <button type="submit" class="btn btn--primary btn--block" id="forgot-btn">Send reset link</button>
          </div>
        </form>
        <p class="muted small" style="text-align:center;margin-top:1.25rem">
          Remember your password? <a href="login.html">Sign in</a>.
        </p>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("forgot-form");
  var btn = document.getElementById("forgot-btn");
  var orig = btn.textContent;
  function flash(msg, tone) {
    var box = document.getElementById("page-status");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var email = String(form.elements.email.value || "").trim();
    if (!email) { flash("Please enter your email.", "error"); return; }
    btn.disabled = true; btn.textContent = "Sending…";
    window.Auth.forgotPassword(email).then(function () {
      btn.disabled = false; btn.textContent = orig;
      flash("If an account exists for that email, a reset link was sent.", "ok");
    }).catch(function () {
      btn.disabled = false; btn.textContent = orig;
      flash("Could not send reset email. Try again later.", "error");
    });
  });
})();
</script>
</body>
</html>
