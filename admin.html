<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Admin &middot; IT Skills Olympics 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">

<a class="skip-link" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">&gt;_</span>
      <span class="brand__text"><strong>IT Skills Olympics 2026</strong><span>Cybersecurity Category</span></span>
    </a>
    <nav class="topbar__nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html" aria-current="page">Admin</a>
      <a href="challenges.html">Challenges</a>
    </nav>
    <div class="topbar__status">
      <button class="btn btn--ghost btn--small" id="logout-btn">Sign out</button>
    </div>
  </div>
</header>

<main id="main" class="wrap page">
  <div class="page-status" id="flash" role="status" aria-live="polite" data-visible="false"></div>

  <section class="section">
    <div class="section__head"><h2>Organizer dashboard</h2></div>
    <div class="grid-2">
      <div class="panel stat-card"><div class="big" id="admin-users">0</div><div class="label">Users</div></div>
      <div class="panel stat-card"><div class="big" id="admin-teams">0</div><div class="label">Teams</div></div>
      <div class="panel stat-card"><div class="big" id="admin-requests">0</div><div class="label">Pending requests</div></div>
      <div class="panel stat-card"><div class="big" id="admin-messages">0</div><div class="label">Chat messages</div></div>
    </div>
  </section>

  <section class="section" style="margin-top:1.5rem">
    <div class="section__head"><h2>Announcements</h2></div>
    <form id="announce-form" novalidate style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem">
      <input type="text" id="announce-title" placeholder="Title" required style="flex:1;min-width:180px">
      <textarea id="announce-body" placeholder="Body" required style="flex:2;min-width:260px;height:70px"></textarea>
      <button type="submit" class="btn btn--primary">Publish</button>
    </form>
    <div id="announcements-list"></div>
  </section>

  <section class="section" style="margin-top:1.5rem">
    <div class="section__head"><h2>Recent audit log</h2></div>
    <div id="audit-list" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);background:#0c0c0d;padding:0.75rem">
      <div class="muted small">Loading…</div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span>IT Skills Olympics 2026 &middot; Cybersecurity Category</span>
  </div>
</footer>

<div class="page-status" id="page-status" role="status" aria-live="polite" data-visible="false"></div>

<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  function flash(msg, tone) {
    var box = document.getElementById("flash");
    box.textContent = msg; box.className = "page-status" + (tone ? " page-status--" + tone : "");
    box.setAttribute("data-visible", "true");
    setTimeout(function () { box.setAttribute("data-visible", "false"); }, 5000);
  }
  function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  document.getElementById("logout-btn").addEventListener("click", function () {
    window.Auth.logout().then(function () { location.href = "login.html"; });
  });

  window.Auth.load().then(function (u) {
    if (!u || (u.role !== "organizer" && u.role !== "admin")) {
      document.getElementById("main").innerHTML = '<div class="auth-card" style="text-align:center;padding:3rem"><h3>Access denied</h3><p class="muted">Organizer or administrator account required.</p><a href="dashboard.html" class="btn btn--primary">Go to dashboard</a></div>';
      return;
    }
    Promise.all([
      window.Auth.adminStats(),
      window.Auth.adminAudit()
    ]).then(function (results) {
      var stats = results[0].stats || {};
      document.getElementById("admin-users").textContent = stats.users || 0;
      document.getElementById("admin-teams").textContent = stats.teams || 0;
      document.getElementById("admin-requests").textContent = stats.join_requests_pending || 0;
      document.getElementById("admin-messages").textContent = stats.messages || 0;
      var audit = results[1].audit || [];
      var html = audit.map(function (a) {
        return '<div style="padding:0.5rem 0;border-bottom:1px solid var(--border);font-size:0.85rem">' +
          '<div class="muted small" style="font-family:var(--mono)">'+ new Date(a.created_at).toLocaleString() +'</div>' +
          '<div><strong>'+ esc(a.actor_username || "system") +'</strong> &middot; <span style="color:var(--accent)">'+ esc(a.action) +'</span>' +
          (a.target_type ? ' on '+ esc(a.target_type) +' #' + esc(a.target_id) : '') + '</div>' +
          '</div>';
      }).join("");
      document.getElementById("audit-list").innerHTML = html || '<div class="muted small">No audit events.</div>';
    }).catch(function () {
      flash("Could not load admin data.", "error");
    });
  });

  document.getElementById("announce-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var title = document.getElementById("announce-title").value;
    var body = document.getElementById("announce-body").value;
    window.Auth.createAnnouncement({ title: title, body: body, published: true }).then(function () {
      flash("Announcement published.", "ok");
      document.getElementById("announce-title").value = "";
      document.getElementById("announce-body").value = "";
    }).catch(function (e) { flash(e.message || "Could not publish.", "error"); });
  });
})();
</script>
</body>
</html>
